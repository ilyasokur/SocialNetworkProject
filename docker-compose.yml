version: '3.8'

services:
  user-service:
    build: ./user-service
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=testing
      - KEYCLOAK_CLIENT_ID=user-service
      - KEYCLOAK_CLIENT_SECRET=Myhz2XpQSjEqIFvlopUuWdJuynTgKZBD
      - KEYCLOAK_ADMIN_USER=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8001:8001"
    depends_on:
      - db
      - keycloak

  post-service:
    build: ./post-service    
    ports:
      - "50051:50051"
    depends_on:
      - db_post

  proxy-service:
    build: ./api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - user-service

  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users_db
    ports:
      - "5432:5432"
  db_post:
      image: postgres:latest
      restart: always
      environment:
        POSTGRES_USER: user
        POSTGRES_PASSWORD: password
        POSTGRES_DB: posts_db
      ports:
        - "5433:5432"
  
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY: edge
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    command: ["start-dev", "--http-enabled=true"]

    